name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace

  legacy-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: legacy/go/go.mod
          cache: true
          cache-dependency-path: legacy/go/go.sum

      - name: Test
        working-directory: legacy/go
        run: go test ./...

      - name: Build mw
        working-directory: legacy/go
        run: go build ./cmd/mw

      - name: Fresh install smoke
        working-directory: legacy/go
        run: ./scripts/smoke-fresh-install.sh
